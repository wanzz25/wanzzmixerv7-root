<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanzz Mixer V5</title>
<style>
  :root {
    --bg: #0b0d12; --card: #14171f; --line: #2a2f3d;
    --fg: #eef1f6; --muted: #8b92a5; --accent: #ffb700; --ok: #00e676;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 680px; padding: 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; color: var(--accent); }
  p { margin: 0 0 16px; color: var(--muted); }
  b { color: var(--fg); word-break: break-all; }
  pre {
    margin: 0 0 12px; padding: 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
    font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; user-select: all;
  }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #000; font: 700 14px system-ui, sans-serif;
  }
  button.done { background: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>WANZZ MIXER V5</h1>
  <p>Domain terdeteksi: <b id="domain"></b></p>
  <pre id="code"></pre>
  <button id="copy" type="button">Salin loadstring</button>
</main>
<script>
  // Domain dideteksi otomatis dari alamat halaman ini (production, preview, atau domain sendiri)
  var origin = location.origin;
  var code = 'loadstring(game:HttpGet("' + origin + '/WanzzMixer.lua"))()';
  document.getElementById("domain").textContent = location.host;
  document.getElementById("code").textContent = code;
  var btn = document.getElementById("copy");
  btn.addEventListener("click", function () {
    function ok() { btn.textContent = "Tersalin"; btn.classList.add("done");
      setTimeout(function () { btn.textContent = "Salin loadstring"; btn.classList.remove("done"); }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(ok, function () {});
    } else {
      var r = document.createRange(); r.selectNodeContents(document.getElementById("code"));
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand("copy"); ok(); } catch (e) {}
    }
  });
</script>
</body>
</html>
